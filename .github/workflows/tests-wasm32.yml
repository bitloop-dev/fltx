name: Tests WebAssembly

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  emscripten:
    name: WebAssembly Emscripten
    runs-on: ubuntu-latest
    env:
      EMSCRIPTEN_VERSION: 4.0.10
      EMSDK_CACHE_FOLDER: emsdk-cache
      VCPKG_CACHE_EPOCH: v2
      VCPKG_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-binary-cache
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-binary-cache,readwrite
      VCPKG_MAX_CONCURRENCY: 4

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake build-essential libtool ninja-build pkg-config

      - name: Set up Emscripten
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: ${{ env.EMSCRIPTEN_VERSION }}
          actions-cache-folder: ${{ env.EMSDK_CACHE_FOLDER }}

      - name: Fetch vcpkg registry baseline
        run: |
          baseline="$(python3 -c "import json; print(json.load(open('vcpkg-configuration.json'))['default-registry']['baseline'])")"
          git -C vcpkg fetch --depth=1 --no-tags origin "$baseline"
          git -C vcpkg show "$baseline:versions/baseline.json" > /dev/null

      - name: Read build identities
        id: identity
        run: |
          echo "vcpkg=$(git -C vcpkg rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          compiler="$(em++ --version | sed -n '1p')"
          hash="$(COMPILER="$compiler" python3 -c "import hashlib, os; print(hashlib.sha256(os.environ['COMPILER'].encode()).hexdigest()[:16])")"
          echo "compiler=$hash" >> "$GITHUB_OUTPUT"

      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.VCPKG_BINARY_CACHE }}
          key: vcpkg-${{ env.VCPKG_CACHE_EPOCH }}-wasm32-emscripten-${{ steps.identity.outputs.compiler }}-${{ steps.identity.outputs.vcpkg }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'CMakePresets.json', 'cmake/vcpkg-ports/**', 'cmake/vcpkg-triplets/**') }}
          restore-keys: |
            vcpkg-${{ env.VCPKG_CACHE_EPOCH }}-wasm32-emscripten-${{ steps.identity.outputs.compiler }}-${{ steps.identity.outputs.vcpkg }}-
            vcpkg-${{ env.VCPKG_CACHE_EPOCH }}-wasm32-emscripten-${{ steps.identity.outputs.compiler }}-

      - name: Bootstrap vcpkg
        run: ./vcpkg/bootstrap-vcpkg.sh

      - name: Configure
        run: >-
          cmake --preset wasm32-release
          -DVCPKG_MANIFEST_NO_DEFAULT_FEATURES=ON
          -DFLTX_METRICS_QDPP=ON
          -DFLTX_METRICS_TLFLOAT=ON

      - name: Save vcpkg binary cache
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: ${{ env.VCPKG_BINARY_CACHE }}
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Build and run test gate
        run: cmake --build --preset wasm32-release --target fltx_ci_checks --parallel
