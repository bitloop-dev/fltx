name: Native Accuracy Target

on:
  workflow_call:
    inputs:
      platform_name:
        required: true
        type: string
      runner:
        required: true
        type: string
      configure_preset:
        required: true
        type: string
      compiler_family:
        required: true
        type: string
      target_arch:
        required: true
        type: string

jobs:
  tests:
    name: ${{ inputs.platform_name }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      COMPILER_FAMILY: ${{ inputs.compiler_family }}
      TARGET_ARCH: ${{ inputs.target_arch }}
      EMSCRIPTEN_VERSION: 4.0.10
      EMSDK_CACHE_FOLDER: emsdk-cache
      VCPKG_CACHE_EPOCH: v3
      VCPKG_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-binary-cache
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-binary-cache,readwrite
      VCPKG_MAX_CONCURRENCY: 4
      CONFIGURE_PRESET: ${{ inputs.configure_preset }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up build tools (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake build-essential clang libtool ninja-build pkg-config

      - name: Set up build tools (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install autoconf automake libtool ninja
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix ninja)/bin" >> "$GITHUB_PATH"

      - name: Set up Ninja (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install ninja --no-progress -y

      - name: Set up Visual Studio environment
        if: >-
          runner.os == 'Windows' &&
          (inputs.compiler_family == 'msvc' || inputs.compiler_family == 'clangcl')
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ inputs.target_arch }}

      - name: Set up MinGW
        if: runner.os == 'Windows' && inputs.compiler_family == 'mingw'
        shell: pwsh
        run: |
          choco install mingw --no-progress -y
          'C:\ProgramData\mingw64\mingw64\bin' | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Set up Emscripten
        if: inputs.compiler_family == 'emscripten'
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: ${{ env.EMSCRIPTEN_VERSION }}
          actions-cache-folder: ${{ env.EMSDK_CACHE_FOLDER }}

      - name: Verify native runner architecture
        if: inputs.target_arch != 'wasm32'
        shell: bash
        run: |
          python - <<'PY'
          import os
          import platform
          expected = os.environ["TARGET_ARCH"]
          observed = platform.machine().lower()
          aliases = {
              "x64": {"amd64", "x86_64"},
              "arm64": {"arm64", "aarch64"},
          }
          if observed not in aliases[expected]:
              raise SystemExit(
                  f"runner architecture mismatch: expected {expected}, observed {observed}"
              )
          print(f"native runner architecture: {observed}")
          PY

      - name: Fetch vcpkg registry baseline
        shell: bash
        run: |
          baseline="$(python -c "import json; print(json.load(open('vcpkg-configuration.json'))['default-registry']['baseline'])")"
          git -C vcpkg fetch --depth=1 --no-tags origin "$baseline"
          git -C vcpkg show "$baseline:versions/baseline.json" > /dev/null

      - name: Read build identities
        id: identity
        shell: bash
        run: |
          echo "vcpkg=$(git -C vcpkg rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          case "$COMPILER_FAMILY" in
            msvc) compiler="$(cl 2>&1 | sed -n '1p' || true)" ;;
            clangcl) compiler="$(clang-cl --version | sed -n '1p')" ;;
            clang|appleclang) compiler="$(clang++ --version | sed -n '1p')" ;;
            emscripten) compiler="$(em++ --version | sed -n '1p')" ;;
            *) compiler="$(g++ --version | sed -n '1p')" ;;
          esac
          test -n "$compiler"
          hash="$(COMPILER="$compiler" python -c "import hashlib, os; print(hashlib.sha256(os.environ['COMPILER'].encode()).hexdigest()[:16])")"
          echo "Compiler cache key input: $compiler"
          echo "compiler=$hash" >> "$GITHUB_OUTPUT"

      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.VCPKG_BINARY_CACHE }}
          key: vcpkg-${{ env.VCPKG_CACHE_EPOCH }}-${{ runner.os }}-${{ inputs.target_arch }}-${{ inputs.compiler_family }}-${{ steps.identity.outputs.compiler }}-${{ steps.identity.outputs.vcpkg }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'CMakePresets.json', 'cmake/vcpkg-ports/**', 'cmake/vcpkg-triplets/**') }}
          restore-keys: |
            vcpkg-${{ env.VCPKG_CACHE_EPOCH }}-${{ runner.os }}-${{ inputs.target_arch }}-${{ inputs.compiler_family }}-${{ steps.identity.outputs.compiler }}-${{ steps.identity.outputs.vcpkg }}-
            vcpkg-${{ env.VCPKG_CACHE_EPOCH }}-${{ runner.os }}-${{ inputs.target_arch }}-${{ inputs.compiler_family }}-

      - name: Bootstrap vcpkg (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: ./vcpkg/bootstrap-vcpkg.sh

      - name: Bootstrap vcpkg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\vcpkg\bootstrap-vcpkg.bat

      - name: Configure
        run: >-
          cmake --preset ${{ inputs.configure_preset }}
          -DVCPKG_MANIFEST_NO_DEFAULT_FEATURES=ON

      - name: Verify configured compiler
        shell: bash
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          cmake_files = Path("build", os.environ["CONFIGURE_PRESET"], "CMakeFiles")
          compiler_file = next(cmake_files.glob("*/CMakeCXXCompiler.cmake"))
          compiler_facts = compiler_file.read_text(encoding="utf-8")

          def fact(name):
              match = re.search(rf'set\({name} "([^"]*)"\)', compiler_facts)
              return match.group(1) if match else ""

          family = os.environ["COMPILER_FAMILY"]
          expected_ids = {
              "msvc": "MSVC",
              "clangcl": "Clang",
              "mingw": "GNU",
              "gcc": "GNU",
              "clang": "Clang",
              "appleclang": "AppleClang",
              "emscripten": "Clang",
          }
          compiler_id = fact("CMAKE_CXX_COMPILER_ID")
          if compiler_id != expected_ids[family]:
              raise SystemExit(
                  f"configured compiler mismatch: expected {expected_ids[family]}, "
                  f"observed {compiler_id or 'unknown'}"
              )
          frontend = fact("CMAKE_CXX_COMPILER_FRONTEND_VARIANT")
          if family == "clangcl" and frontend != "MSVC":
              raise SystemExit(
                  f"configured frontend mismatch: expected MSVC, observed {frontend or 'unknown'}"
              )
          print(f"configured compiler: {compiler_id}, frontend: {frontend or 'unspecified'}")
          PY

      - name: Save vcpkg binary cache
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: ${{ env.VCPKG_BINARY_CACHE }}
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Build and run accuracy gate
        run: >-
          cmake --build --preset ${{ inputs.configure_preset }}
          --target fltx_ci_checks --parallel
